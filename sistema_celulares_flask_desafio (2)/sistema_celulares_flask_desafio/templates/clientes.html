<!DOCTYPE html>
<html lang="pt-BR">


<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
  <title>Clientes</title>
</head>


<body>
  <header id="topo"></header>


  <main>
    <div id="msg" class="msg"></div>


    <!-- Pesquisa de clientes -->
    <div class="card">
      <h3>Buscar clientes</h3>


      <form id="busca" class="grid">
        <label>
          Nome, telefone ou e-mail
          <input
            id="q"
            type="text"
            placeholder="Digite para pesquisar..."
          >
        </label>


        <div>
          <button type="submit">Pesquisar</button>
          <button type="button" class="sec" id="todos">
            Mostrar todos
          </button>
        </div>
      </form>
    </div>


    <!-- Cadastro e edição -->
    <div class="card">
      <h3 id="titulo">Novo cliente</h3>


      <form id="f" class="grid">
        <input type="hidden" id="id">


        <label>
          Nome
          <input id="nome" required>
        </label>


        <label>
          CPF
          <input id="cpf" placeholder="000.000.000-00">
        </label>


        <label>
          Telefone
          <input id="telefone">
        </label>


        <label>
          E-mail
          <input id="email" type="email">
        </label>


        <label>
          Endereço
          <input id="endereco">
        </label>


        <div>
          <button type="submit">Salvar</button>
          <button type="button" class="sec" id="cancelar">
            Cancelar
          </button>
        </div>
      </form>


      <small>
        Ao editar, deixe o CPF vazio para mantê-lo.
        O CPF é armazenado criptografado (bcrypt) e não é exibido.
      </small>
    </div>


    <!-- Lista de clientes -->
    <div class="card">
      <h3>Lista de clientes</h3>


      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th>Endereço</th>
            <th>Ações</th>
          </tr>
        </thead>


        <tbody id="lista"></tbody>
      </table>
    </div>
  </main>


  <script src="/static/app.js"></script>


  <script>
    const campos = [
      "nome",
      "cpf",
      "telefone",
      "email",
      "endereco"
    ];


    // Limpa o formulário
    function limpar() {
      f.reset();
      id.value = "";
      titulo.textContent = "Novo cliente";
    }


    // Prepara o formulário para editar
    function editar(c) {
      preencher(campos, c);
      id.value = c.id;
      titulo.textContent = "Editar cliente #" + c.id;
      window.scrollTo(0, 0);
    }


    // Carrega e exibe os clientes
    async function carregar() {
      const dados = await api(
        "/api/clientes?q=" + encodeURIComponent(q.value)
      );


      lista.replaceChildren(
        ...dados.map(c =>
          linha(
            [
              c.nome,
              c.telefone,
              c.email,
              c.endereco
            ],
            botao("Editar", () => editar(c)),
            botaoExcluir(
              "/api/clientes/" + c.id,
              "Excluir " + c.nome + "?",
              carregar
            )
          )
        )
      );
    }


    // Pesquisa
    busca.onsubmit = e => {
      e.preventDefault();
      tentar(carregar);
    };


    // Mostra todos os clientes
    todos.onclick = () => {
      q.value = "";
      tentar(carregar);
    };


    // Cancela a edição
    cancelar.onclick = limpar;


    // Salva ou atualiza o cliente
    f.onsubmit = e => {
      e.preventDefault();


      tentar(async () => {
        await api(
          "/api/clientes" + (id.value ? "/" + id.value : ""),
          id.value ? "PUT" : "POST",
          lerCampos(campos)
        );


        limpar();
        await carregar();
      }, "Cliente salvo com sucesso.");
    };


    // Monta o menu e carrega os clientes
    montarMenu()
      .then(carregar)
      .catch(erro => {
        console.error("Erro ao carregar clientes:", erro);
      });
  </script>
</body>


</html>
